name: household_lints
description: >-
  household_accountsのRepository実装規約(Future<Result<T>>を返す公開メソッドは
  Result.guard(...)を直接返す)を、Dartネイティブのanalyzer plugin機構で機械検証するプラグイン。
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: ^14.1.0

dev_dependencies:
  analyzer_testing: ^0.3.4
  lints: ^6.1.0
  test: ^1.31.2
  test_reflective_loader: ^0.4.0
