# 開発ツールのバージョンの唯一の正。
# ローカル(mise)とCI(jdx/mise-action)はどちらもこのファイルとmise.lockを読むため、
# ここを変えれば全環境のバージョンが一斉に変わる。ワークフロー側にバージョンを書かないこと。
# 更新手順: バージョンを書き換えて `mise lock --platform linux-x64,windows-x64` を実行し、
# mise.lockも一緒にコミットする(Dependabotはこのファイルを更新できない)。
min_version = "2026.8.11"

[settings]
lockfile = true

[tools]
flutter = "3.47.9"
# Androidリリースビルド(Gradle)用のJDK
java = "temurin-21.0.13+9.0.LTS"
# Cloud Functionsのランタイム(firebase/functions/package.jsonのengines)に合わせる
node = "22.23.4"
# Firebaseエミュレータ(integrationテスト)とデプロイに使う
firebase = "15.26.0"
