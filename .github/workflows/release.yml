name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_dispatchは任意ブランチで起動できるため、リリース元をmasterに固定する
          ref: master
          # タグ重複ガードで全タグの参照が必要
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          semver=${current%+*}
          build=${current#*+}
          IFS=. read -r major minor patch <<< "$semver"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new_semver="$major.$minor.$patch"
          new_build=$((build+1))
          if git rev-parse "v$new_semver" >/dev/null 2>&1; then
            echo "::error::Tag v$new_semver already exists"
            exit 1
          fi
          sed -i "s/^version: .*/version: $new_semver+$new_build/" pubspec.yaml
          echo "version=$new_semver" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_semver" >> "$GITHUB_OUTPUT"
          echo "full=$new_semver+$new_build" >> "$GITHUB_OUTPUT"

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # build.gradleのfile()はandroid/app/基準で相対パスを解決するため絶対パスで指定する
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build app bundle
        run: flutter build appbundle --release

      # ビルド成功後にのみバージョンを確定させ、失敗ビルドで履歴を汚さない
      - name: Commit version bump and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.full }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin master --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
