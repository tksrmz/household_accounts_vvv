name: Release

# NOTE: モノレポ統合時の履歴移設ではGitHubにワークフローとして登録されなかったため、
# 登録を発火させる目的でこのコメントを追加した(2026-11-23、動作内容の変更なし)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_dispatchは任意ブランチで起動できるため、リリース元をmasterに固定する
          ref: master
          # タグ重複ガードで全タグの参照が必要
          fetch-depth: 0

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          semver=${current%+*}
          build=${current#*+}
          IFS=. read -r major minor patch <<< "$semver"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new_semver="$major.$minor.$patch"
          new_build=$((build+1))
          if git rev-parse "v$new_semver" >/dev/null 2>&1; then
            echo "::error::Tag v$new_semver already exists"
            exit 1
          fi
          sed -i "s/^version: .*/version: $new_semver+$new_build/" pubspec.yaml
          echo "version=$new_semver" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_semver" >> "$GITHUB_OUTPUT"
          echo "full=$new_semver+$new_build" >> "$GITHUB_OUTPUT"

      - name: Build signed release app bundle
        uses: ./.github/actions/build-release-appbundle
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}

      # ビルド成功後にのみバージョンを確定させ、失敗ビルドで履歴を汚さない
      - name: Commit version bump and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.full }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin master --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
