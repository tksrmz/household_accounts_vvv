name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot-triggered runs cannot read Actions secrets (they only get
    # Dependabot secrets), so CLAUDE_CODE_OAUTH_TOKEN would be empty and the
    # job would always fail. Dependency bumps do not need a Claude review.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access is required to post the review back to the PR, for both
      # the inline comments and the "no issues found" summary. The summary
      # goes through `gh pr comment`, which hits the issue comments API, but
      # that endpoint accepts either Issues or Pull requests write -- so the
      # grant below covers it and issues stays read-only.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # /pr-review is this repo's own command, in .claude/commands/, rather
          # than the code-review@claude-code-plugins plugin it was vendored from.
          # The plugin stops the moment Claude has commented on a PR once, so a
          # push to an open PR was never reviewed. The action reads the project
          # setting sources by default, so the checkout above is all it takes to
          # make the command available.
          #
          # Without --comment the review is only written to the job log and
          # nothing is posted to the PR.
          #
          # --since narrows a re-run to the commits that were just pushed. Only
          # synchronize carries github.event.before, so the flag is omitted for
          # every other event and those runs review the whole PR.
          prompt: >-
            /pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            --comment
            ${{ github.event.action == 'synchronize' && format('--since {0}', github.event.before) || '' }}
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

