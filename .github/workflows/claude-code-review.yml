name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot-triggered runs cannot read Actions secrets (they only get
    # Dependabot secrets), so CLAUDE_CODE_OAUTH_TOKEN would be empty and the
    # job would always fail. Dependency bumps do not need a Claude review.
    #
    # github-actions[bot] is the actor of the commit that
    # update-canonical-goldens.yml pushes to the PR branch. That commit only
    # contains golden PNGs, so there is nothing to review, and the action
    # rejects non-human actors unless they are listed in `allowed_bots`
    # ("Workflow initiated by non-human actor"). Skip the job rather than
    # allow the bot, so a red check does not remain on every golden update.
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access is required to post the review back to the PR, for both
      # the inline comments and the "no issues found" summary. The summary
      # goes through `gh pr comment`, which hits the issue comments API, but
      # that endpoint accepts either Issues or Pull requests write -- so the
      # grant below covers it and issues stays read-only.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the review is only written to the job log and
          # nothing is posted to the PR.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # The prompt above reaches Claude as a Skill call, and the action does
          # not grant Skill rules for the plugins it installs. A headless run
          # cannot answer a permission prompt, so the call is auto-denied
          # ("Execute skill: code-review:code-review") and the plugin's command
          # never runs. Claude then reviews the PR unaided and has none of the
          # posting tools that command's frontmatter would have granted, which
          # is why four runs in a row finished a real review and posted nothing.
          #
          # anthropics/claude-code-action#1467 fixes this upstream by deriving
          # Skill(<plugin>:*) from the plugins input; it is still open, so grant
          # the same rule here. Drop this once that lands.
          # The review still does not finish. The plugin launches its agents
          # through the Agent tool, which backgrounds them, and the turn ends on
          # "I'll wait for them to complete" with nothing in a headless run to
          # resume it. anthropics/claude-code-action#1462; tracked here in the
          # issue this workflow's companion monitor watches.
          #
          # Disallowing ScheduleWakeup/SendMessage/Monitor/TaskList, which is
          # what #1465 proposes as the default, was tried and did not help: the
          # model never called a wait tool, it just ended its turn. That flag is
          # gone again rather than left behind looking load-bearing.
          claude_args: |
            --allowedTools "Skill(code-review:*)"
          # TEMPORARY, for diagnosis. The review has now run to completion three
          # times without posting anything to the pull request, and the action
          # hides Claude's output by default, so the log says only that it
          # succeeded. This shows the full JSON stream, which is the only way to
          # tell whether the command decided the PR needed no review, found
          # nothing, or failed to post.
          #
          # It prints every message including tool results. That is acceptable
          # here only because this repository is private, so the logs are
          # visible to people with repository access rather than to anyone, and
          # because CLAUDE_CODE_OAUTH_TOKEN comes from secrets and is masked.
          # Remove this once the behaviour is understood.
          show_full_output: 'true'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

