name: PR CI

on:
  pull_request:
    branches: [master]
    paths:
      # format/analyze/testの対象になるソースファイル等
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      # golden testがfonts/NotoSansJP.ttfを読み込むため、フォント変更も検査対象
      - 'fonts/**'
      # household_lints(custom analyzer plugin)一式
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.yaml'
      - 'analysis_options.yaml'
      - 'dart_test.yaml'
      # ツールのバージョン(Flutter等)
      - 'mise.toml'
      - 'mise.lock'
      # このCI自体
      - '.github/workflows/pr-ci.yml'
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: flutter
    steps:
      - uses: actions/checkout@v7

      # バージョンはmise.toml(+mise.lock)が正。入れるツールはジョブのMISE_ENABLE_TOOLSで絞る
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-v1-${{ env.MISE_ENABLE_TOOLS }}

      - name: Install dependencies
        run: flutter pub get

      # household_lints(packages/household_lints)はcustom analyzer plugin用の
      # 独立したpub package(ルートのpubspec.yamlには依存追加していない)なので、
      # 依存解決とルール自体のテストはここで個別に行う。
      # アプリ本体と同じジョブで、かつ後段のdart analyzeより先に実行する理由:
      # ルール自体が壊れていると、dart analyzeは「違反ゼロ」と「ルールが動いて
      # いない」を区別できず、規約の強制が黙って無効化される。そのため先に
      # 番人(ルール)の生存をテストで証明してから、本体の検証に進む順序にしている。
      - name: Install household_lints dependencies
        run: dart pub get
        working-directory: packages/household_lints

      - name: Test household_lints rules
        run: dart test
        working-directory: packages/household_lints

      # pub get後: dart formatは.dart_tool/package_config.jsonの言語バージョンで
      # スタイル(short/tall)を決めるため、これが無いと判定がローカルとズレる。
      # build_runner前: 生成ファイルがまだ存在せず、コミット済みファイルのみが対象になる。
      # (packages/household_lints配下もこの1コマンドの走査対象に含まれる)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code
        run: dart run build_runner build

      # 後段のdart analyzeと同じ解析エンジン・同じanalysis_options.yamlを読むため
      # 現状の検出内容はほぼ同一だが、Flutter標準の検査経路として維持する:
      # 将来flutter analyze側にFlutter固有の検査や既定が追加された場合はこちらで
      # しか拾えず、ローカル開発の標準コマンド(flutter analyze)との整合も保てる。
      - name: Analyze
        run: flutter analyze --no-pub

      # household_lintsのルール(repository_must_use_result_guard)違反はdart analyzeで
      # 検知させる: flutter analyzeの一発実行(analyze_once)は、analysis serverの
      # ANALYZING進捗完了を受け取り次第サーバーを終了させる実装になっており、
      # 非同期に届くプラグイン診断は間に合ったときしか報告されない(タイミング依存で
      # 取りこぼすことを実地確認済み)。ゲートには、プラグインの解析完了を待ってから
      # 集計するdart analyzeを使う。
      - name: Analyze with household_lints plugin
        run: dart analyze

      - name: Run non-golden tests
        run: flutter test --no-pub --exclude-tags golden

  golden:
    runs-on: ubuntu-latest
    env:
      GOLDEN_MODE: ci
      MISE_ENABLE_TOOLS: flutter
    steps:
      - uses: actions/checkout@v7

      # バージョンはmise.toml(+mise.lock)が正。入れるツールはジョブのMISE_ENABLE_TOOLSで絞る
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-v1-${{ env.MISE_ENABLE_TOOLS }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Compare canonical goldens
        id: compare
        continue-on-error: true
        run: flutter test --no-pub --tags golden

      - name: Upload golden comparison failures
        if: steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: golden-comparison-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove tracked canonical goldens
        shell: bash
        run: |
          git ls-files -z -- \
            ':(glob)test/**/golden/**/*.png' \
            ':(glob)test/**/goldens/**/*.png' \
            | while IFS= read -r -d '' file; do rm -- "$file"; done

      - name: Regenerate canonical goldens
        id: regenerate
        continue-on-error: true
        env:
          ALLOW_CANONICAL_GOLDEN_UPDATE: 'true'
        run: flutter test --no-pub --tags golden --update-goldens

      - name: Detect canonical golden changes
        id: golden-diff
        if: steps.regenerate.outcome == 'success'
        shell: bash
        run: |
          # マッチ0件のpathspecを git add に直接渡すと exit 128 で落ちる
          # (旧世代の goldens/ 複数形ディレクトリは移行の過程で消滅しうる)ため、
          # 対象ファイルを列挙してから1件ずつaddする
          git ls-files -z --cached --others --exclude-standard -- \
            ':(glob)test/**/golden/**/*.png' \
            ':(glob)test/**/goldens/**/*.png' \
            | while IFS= read -r -d '' file; do git add -A -- "$file"; done

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --name-status
          fi

      - name: Upload canonical golden candidates
        if: steps.golden-diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: canonical-golden-candidates
          path: |
            test/**/golden/**/*.png
            test/**/goldens/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Verify golden status
        if: ${{ !cancelled() }}
        shell: bash
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          REGENERATE_OUTCOME: ${{ steps.regenerate.outcome }}
          GOLDENS_CHANGED: ${{ steps.golden-diff.outputs.changed }}
        run: |
          failed=false

          if [[ "$COMPARE_OUTCOME" != "success" ]]; then
            echo "::error::Canonical golden comparison failed."
            failed=true
          fi

          if [[ "$REGENERATE_OUTCOME" != "success" ]]; then
            echo "::error::Canonical golden regeneration failed."
            failed=true
          elif [[ "$GOLDENS_CHANGED" == "true" ]]; then
            echo "::error::Canonical golden update is required."
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
