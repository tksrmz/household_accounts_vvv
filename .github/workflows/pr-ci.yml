name: PR CI

on:
  pull_request:
    branches: [master]
    paths:
      # format/analyze/testの対象になるソースファイル等
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      # golden testがfonts/NotoSansJP.ttfを読み込むため、フォント変更も検査対象
      - 'fonts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.yaml'
      - 'analysis_options.yaml'
      - 'dart_test.yaml'
      # このCI自体
      - '.github/workflows/pr-ci.yml'

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pub get後: dart formatは.dart_tool/package_config.jsonの言語バージョンで
      # スタイル(short/tall)を決めるため、これが無いと判定がローカルとズレる。
      # build_runner前: 生成ファイルがまだ存在せず、コミット済みファイルのみが対象になる。
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub
