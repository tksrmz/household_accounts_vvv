name: Build release app bundle
description: Set up the Android toolchain, sign the app, and build a release AAB

inputs:
  keystore-base64:
    description: Base64-encoded Android signing keystore
    required: true
  keystore-password:
    description: Android signing keystore password
    required: true
  key-password:
    description: Android signing key password
    required: true
  key-alias:
    description: Android signing key alias
    required: true

runs:
  using: composite
  steps:
    # Flutter・JDKのバージョンはmise.toml(+mise.lock)が正。JAVA_HOMEもmiseが後続ステップへ設定する
    - name: Set up Flutter and Java
      uses: jdx/mise-action@v5
      env:
        MISE_ENABLE_TOOLS: flutter,java
      with:
        cache_key_prefix: mise-v1-flutter-java

    # ランナー既定のJDKではなくmise.tomlのJDKでビルドされることをログに残す
    - name: Show toolchain versions
      shell: bash
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        flutter --version

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.2.0

    - name: Set up signing
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
      run: |
        set -euo pipefail
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        cat > android/key.properties <<EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=$RUNNER_TEMP/upload-keystore.jks
        EOF

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Generate code
      shell: bash
      run: dart run build_runner build

    - name: Build release app bundle
      shell: bash
      run: flutter build appbundle --release
